name: Keep Streamlit Awake

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours
  workflow_dispatch:        # Allows running manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Visit App & Click Wake If Needed
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('https://debate-arena-vhheq3eyydnsn9rkzot54u.streamlit.app', timeout=60000)
              page.wait_for_timeout(5000)
              # If wake button exists, click it
              btn = page.query_selector('button:has-text(\"Yes, get this app back up!\")')
              if btn:
                  btn.click()
                  page.wait_for_timeout(10000)
              browser.close()
          "
